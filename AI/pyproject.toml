[project]
name = "s8000-ai"
version = "0.1.0"
description = "S8000 firmware RAG indexing script"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "chromadb>=1.5.9",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-vector-stores-chroma>=0.6.0",
    "sentence-transformers",
    "pypdfium2>=4.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "pdfplumber>=0.10.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]